<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://cdn.jsdelivr.net; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests;"
  >
  <title>Entrar | Monitoramento de Indícios</title>
  <link rel="stylesheet" href="./login.css">
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="login-title">
      <header class="login-header">
        <div class="brand-mark" aria-hidden="true">MI</div>
        <p class="eyebrow">SMSA/CE</p>
        <h1 id="login-title">Monitoramento de Indícios</h1>
        <p class="login-description">Acesse o ambiente interno com suas credenciais.</p>
      </header>

      <!-- Bloco de aviso para novo cadastro -->
      <div class="login-notice" role="region" aria-label="Solicitação de acesso">
        <span>Ainda não possui acesso?</span>
        <a href="./cadastro.html" class="notice-link">Solicite seu cadastro aqui</a>
      </div>

      <form id="login-form" class="login-form" autocomplete="on" novalidate>
        <div class="field">
          <label for="email">E-mail</label>
          <input
            id="email"
            name="email"
            type="email"
            inputmode="email"
            autocomplete="username"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            maxlength="254"
            placeholder="login@saude.gov.br"
            required
          >
        </div>

        <div class="field">
          <div class="field-heading">
            <label for="password">Senha</label>
            <button class="forgot-password" type="button" aria-label="Recuperação de senha ainda não disponível">
              Esqueceu a senha?
            </button>
          </div>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            autocapitalize="none"
            autocorrect="off"
            minlength="8"
            maxlength="256"
            placeholder="Digite sua senha"
            required
          >
        </div>

        <button id="login-button" class="login-button" type="submit">
          <span>Entrar</span>
        </button>
      </form>

      <footer class="login-footer">
        <p>Acesso restrito a usuários autorizados.</p>
        
        <!-- A mensagem de login foi movida para cá -->
        <div id="login-message" class="login-message" role="alert" aria-live="polite" hidden></div>
      </footer>
    </section>
  </main>

  <script type="module" src="./js/autenticacao.js"></script>
</body>
</html>
