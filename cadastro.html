<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive">

  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; img-src 'self' data: https://challenges.cloudflare.com; font-src 'self' data: https://challenges.cloudflare.com; script-src 'self' https://cdn.jsdelivr.net https://challenges.cloudflare.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; worker-src 'self' blob: https://challenges.cloudflare.com; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests;"
  >

  <title>Solicitar Cadastro | Monitoramento de Indícios</title>

  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./cadastro.css">
</head>

<body>
  <main class="signup-page">
    <section class="signup-card" aria-labelledby="signup-title">
      <header class="signup-header">
        <div class="brand-mark" aria-hidden="true">MI</div>
        <p class="eyebrow">SMSA/CE</p>
        <h1 id="signup-title">Solicitar Cadastro</h1>
        <p class="signup-description">
          Preencha seus dados para enviar uma solicitação de acesso à gestão.
        </p>
      </header>

      <div
        id="feedback-banner"
        class="feedback-banner hidden"
        role="alert"
        aria-live="assertive"
      ></div>

      <form id="form-cadastro" class="signup-form" novalidate>
        <div class="field">
          <label for="nome-completo">Nome completo</label>
          <input
            type="text"
            id="nome-completo"
            name="nome-completo"
            autocomplete="name"
            minlength="3"
            maxlength="150"
            placeholder="Digite seu nome completo"
            required
          >
        </div>

        <div class="field">
          <label for="cadastro-email">E-mail institucional</label>
          <input
            type="email"
            id="cadastro-email"
            name="cadastro-email"
            inputmode="email"
            autocomplete="email"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            maxlength="254"
            placeholder="login@saude.gov.br"
            required
          >
        </div>

        <div class="security-verification">
          <p class="security-label">Verificação de segurança</p>
          <div id="turnstile-widget" data-sitekey="0x4AAAAAAEkNYPmGWBdFu7uf"></div>
          <p id="security-help" class="security-help" aria-live="polite">
            Aguarde a conclusão da verificação de segurança.
          </p>
        </div>

        <button id="signup-button" class="signup-button" type="submit">
          <span>Enviar Solicitação</span>
        </button>
      </form>

      <footer class="signup-footer">
        <p>
          Já possui uma conta?
          <a href="./index.html">Voltar para o Login</a>
        </p>
      </footer>
    </section>
  </main>

  <script type="module" src="./js/cadastro.js"></script>
</body>
</html>
