<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Solicitar Cadastro | Monitoramento de Indícios</title>
  <link rel="stylesheet" href="./cadastro.css">
</head>
<body>
  <main class="signup-page">
    <section class="signup-card" aria-labelledby="signup-title">
      <header class="signup-header">
        <div class="brand-mark" aria-hidden="true">MI</div>
        <p class="eyebrow">SMSA/CE</p>
        <h1 id="signup-title">Solicitar Cadastro</h1>
        <p class="signup-description">Preencha os dados para enviar sua solicitação para a gestão.</p>
      </header>

      <!-- Banner de Alerta Global (Mensagens do Supabase/Sucesso) -->
      <div id="feedback-banner" class="feedback-banner hidden" role="alert"></div>

      <form id="form-cadastro" class="signup-form" novalidate>
        <div class="field">
          <label for="nome-completo">Nome Completo</label>
          <input
            type="text"
            id="nome-completo"
            name="nome-completo"
            placeholder="Digite seu nome completo"
          >
        </div>

        <div class="field">
          <label for="cadastro-email">E-mail Institucional</label>
          <input
            type="email"
            id="cadastro-email"
            name="cadastro-email"
            placeholder="login@saude.gov.br"
          >
        </div>

        <div class="field">
          <label for="cadastro-password">Senha</label>
          <input
            type="password"
            id="cadastro-password"
            name="cadastro-password"
            placeholder="Mínimo 8 caracteres"
          >
        </div>

        <div class="field">
          <label for="confirmar-password">Confirmar Senha</label>
          <input
            type="password"
            id="confirmar-password"
            name="confirmar-password"
            placeholder="Repita sua senha"
          >
        </div>

        <button id="signup-button" class="signup-button" type="submit">
          <span>Enviar Solicitação</span>
        </button>
      </form>

      <footer class="signup-footer">
        <p>Já possui uma conta? <a href="./index.html" class="footer-link">Voltar para o Login</a></p>
      </footer>
    </section>
  </main>

  <script type="module" src="./js/cadastro.js"></script>
</body>
</html>
